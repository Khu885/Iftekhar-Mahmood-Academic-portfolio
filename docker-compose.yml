services:
  postgres:
    image: postgres:16-alpine
    container_name: uncle-portfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-uncle_portfolio}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-uncle_portfolio}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
