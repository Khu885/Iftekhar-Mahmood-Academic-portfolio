spring:
  datasource:
    url: jdbc:h2:mem:portfolio;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: test-secret-test-secret-test-secret
  expiration-ms: 3600000
  cookie-name: JWT_TOKEN

app:
  admin:
    username: admin
    password: password
    roles:
      - ADMIN
  cors:
    allowed-origins:
      - http://localhost:3000
  security:
    secure-cookie: false
    same-site: Lax

server:
  port: 8080
