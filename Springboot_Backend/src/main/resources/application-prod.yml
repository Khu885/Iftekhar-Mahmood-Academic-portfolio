
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: Existing Neon database

app:
  security:
    secure-cookie: true
    same-site: Lax

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never

